name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras ~1 semana sin actividad.
# Esta tarea hace una consulta ligera dos veces por semana para evitarlo.
# Nota: GitHub desactiva las tareas programadas si el repositorio pasa 60 días
# sin cambios; si llega un email avisándolo, basta con reactivarla en la pestaña Actions.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunes y jueves a las 06:17 UTC
  workflow_dispatch:          # permite lanzarla a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          # La URL y la clave pública (anon) se leen de core/supabase.js, que ya es público.
          BASE=$(grep -oE "https://[a-z0-9]+\.supabase\.co" core/supabase.js | head -1)
          ANON=$(grep -oE "eyJ[A-Za-z0-9._-]+" core/supabase.js | head -1)
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$BASE/rest/v1/productos?select=id&limit=1" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
          echo "Respuesta de Supabase: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no responde (código $code). ¿Está pausado? Revisa https://supabase.com/dashboard"
            exit 1
          fi
